  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#grid)" opacity="0.7"/>
  <circle cx="300" cy="235" r="86" fill="#ffffff" stroke="#c8d3e5" stroke-width="8"/>
  <path d="M150 500c19-92 76-142 150-142s131 50 150 142" fill="#ffffff" stroke="#c8d3e5" stroke-width="8" stroke-linecap="round"/>
