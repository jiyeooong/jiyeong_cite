      <stop offset="0" stop-color="#8bb4c9"/>
      <stop offset="0.55" stop-color="#d5d0be"/>
      <stop offset="1" stop-color="#596b52"/>
    </linearGradient>
    <linearGradient id="city" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#adc7d5"/>
      <stop offset="1" stop-color="#6f806f"/>
