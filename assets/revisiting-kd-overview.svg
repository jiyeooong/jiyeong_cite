      .box{fill:#f7f7f7;stroke:#777;stroke-width:4}
      .soft{fill:#fff8d6;stroke:#888;stroke-width:4}
      .loss{fill:#f2f2f2;stroke:#111;stroke-width:4}
      .queue{fill:#ededed;stroke:#999;stroke-width:3;filter:url(#shadow)}
      .red{fill:#ff1515;stroke:#111;stroke-width:3}
      .purple{fill:#a8329b;stroke:#111;stroke-width:3}
      .circle{fill:#d7d7d7;stroke:#111;stroke-width:3}
      .tri{fill:#e0e0e0;stroke:#111;stroke-width:3}
