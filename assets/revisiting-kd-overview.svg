<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1717 942" role="img" aria-labelledby="title desc">
  <title id="title">Revisiting domain-adaptive semantic segmentation overview</title>
  <desc id="desc">A compact method overview with source and target images, frozen and EMA teachers, region queue, contrastive loss, and segmentation losses.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7a7a7a"/>
